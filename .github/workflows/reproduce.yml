name: Reproduce verified IDS experiment

on:
  workflow_dispatch:
  push:
    paths:
      - "code/**"
      - "results/UNSW_Benchmark_Verified_Results.json"
      - ".github/workflows/reproduce.yml"

permissions:
  contents: write

jobs:
  reproduce:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          persist-credentials: true

      - name: Configure Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Run public dataset experiment
        run: node code/UNSW_NB15_Extract_Experiment.mjs

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install plotting dependencies
        run: python -m pip install -r requirements/visualization.txt

      - name: Verify recorded metrics and confusion matrix
        run: python code/check_results.py

      - name: Regenerate nine research figures
        run: python code/render_figures.py

      - name: Store full predictions and metrics
        run: |
          mv UNSW_Benchmark_Metrics.json results/UNSW_Benchmark_Metrics.json
          mv UNSW_Heldout_Predictions.csv results/UNSW_Heldout_Predictions.csv

      - name: Upload complete reproducibility run
        uses: actions/upload-artifact@v4
        with:
          name: openEuler-UNSW-NB15-reproduction
          path: |
            results/UNSW_Benchmark_Metrics.json
            results/UNSW_Benchmark_Verified_Results.json
            results/UNSW_Heldout_Predictions.csv
            figures/Figure*.png

      - name: Publish reproducible outputs to repository
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add figures/Figure*.png results/UNSW_Benchmark_Metrics.json results/UNSW_Heldout_Predictions.csv
          if ! git diff --cached --quiet; then
            git commit -m "Publish verified experiment predictions and figures [skip ci]"
            git push origin HEAD:main
          fi
